<style>
:root{--bg:#000;--card:#111;--line:#2a2a2a;--txt:#f2f2f2;--mute:#9a9a9a;--acc:#e8e8e8}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--txt);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.6}
header{position:sticky;top:0;z-index:20;background:#000d;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
header img{height:44px;width:44px;border-radius:50%}
nav{display:flex;gap:6px}
nav button,.btn{background:none;border:1px solid var(--line);color:var(--txt);padding:8px 16px;border-radius:30px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#000;font-weight:bold}
.cartb{position:relative}
.cartb span{position:absolute;top:-6px;left:-6px;background:#fff;color:#000;border-radius:50%;min-width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.hero{text-align:center;padding:20px 10px 6px}
.hero img{width:min(300px,70vw);border-radius:50%}
.hero p{color:var(--mute);letter-spacing:3px;margin-top:6px;direction:ltr}
h2{text-align:center;margin:22px 0 14px;font-weight:normal;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 12px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card .im{aspect-ratio:1;background:#000 center/cover no-repeat;display:grid;place-items:center}
.card .im img{width:100%;height:100%;object-fit:cover}
.card .im img.ph{width:55%;height:auto;opacity:.35;border-radius:50%}
.card div.b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
.pr{color:var(--acc);font-weight:bold}
select,input,textarea{width:100%;background:#000;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
.add{background:var(--acc);color:#000;border:0;border-radius:8px;padding:10px;font:inherit;font-weight:bold;cursor:pointer;margin-top:auto}
.ov{position:fixed;inset:0;background:#000c;z-index:30;display:none;justify-content:center;align-items:flex-end}
.ov.show{display:flex}
.sheet{background:#0b0b0b;border:1px solid var(--line);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row small{color:var(--mute)}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--txt);font-size:16px;cursor:pointer}
label{display:block;margin:10px 0 4px;color:var(--mute);font-size:14px}
.tot{font-size:18px;font-weight:bold;margin:12px 0;display:flex;justify-content:space-between}
.wa{background:#25d366;color:#000;border:0;border-radius:10px;padding:13px;width:100%;font:inherit;font-weight:bold;cursor:pointer;margin-top:8px}
.sheet{position:relative}.card{cursor:pointer}
.x{position:absolute;top:10px;left:10px;z-index:2;background:#000a;border:1px solid var(--line);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.dim{aspect-ratio:1;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center;margin-bottom:12px}.dim img{width:100%;height:100%;object-fit:cover}.dim img.ph{width:50%;height:auto;opacity:.35;border-radius:50%}
.ft{margin:10px 18px 0;color:#cfcfcf;font-size:14px}.ft li{margin:3px 0}
.chips,.sw{display:flex;flex-wrap:wrap;gap:8px}
.chip,.swb{background:none;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.on,.swb.on{border-color:#fff;background:#1c1c1c;box-shadow:0 0 0 1px #fff}
.swb i{width:20px;height:20px;border-radius:50%;border:1px solid #666;display:inline-block}
footer{text-align:center;color:var(--mute);padding:20px;border-top:1px solid var(--line);font-size:13px}
</style></head><body>

let cat="men",cart=[],msg="";
const $=i=>document.getElementById(i);
$("gov").innerHTML='<option value="">اختر المحافظة</option>'+GOVS.map(g=>`<option>${g}</option>`).join("");
function setCat(c){cat=c;$("t-men").classList.toggle("on",c=="men");$("t-women").classList.toggle("on",c=="women");render()}
function render(){
 $("title").textContent=cat=="men"?"RAVEN | رجالي":"RAVEN | حريمي";
 $("grid").innerHTML=PRODUCTS.filter(p=>p.cat==cat).map(p=>`<div class="card" onclick="openProd(${p.id})"><div class="im">${p.img?`<img src="${p.img}" alt="" loading="lazy">`:`<img class="ph" src="${LOGO}" alt="">`}</div><div class="b"><div>${p.name}</div><div class="pr">${p.price} ${CUR}</div><button class="add">عرض التفاصيل</button></div></div>`).join("");
}
const COLORS=[{n:"أسود",c:"#0a0a0a"},{n:"أبيض",c:"#ffffff"},{n:"رمادي",c:"#8a8a8a"}];
let cur=null,selS="",selC="";
function openProd(id){cur=P(id);selS="";selC="";renderDet();$("detOv").classList.add("show")}
function pickS(s){selS=s;renderDet()}
function pickC(c){selC=c;renderDet()}
function renderDet(){const p=cur;$("det").innerHTML=`<button class="x" onclick="closeAll()">✕</button><div class="dim">${p.img?`<img src="${p.img}" alt="">`:`<img class="ph" src="${LOGO}" alt="">`}</div><h3>${p.name}</h3><div class="pr" style="font-size:20px">${p.price} ${CUR}</div><ul class="ft">${(p.desc||[]).map(d=>`<li>${d}</li>`).join("")}</ul><label>المقاس</label><div class="chips">${p.sizes.map(s=>`<button class="chip ${s==selS?"on":""}" onclick="pickS('${s}')">${s}</button>`).join("")}</div><label>اللون</label><div class="sw">${COLORS.map(c=>`<button class="swb ${c.n==selC?"on":""}" onclick="pickC('${c.n}')"><i style="background:${c.c}"></i>${c.n}</button>`).join("")}</div><button class="wa" style="margin-top:16px" onclick="addDet()">أضف للسلة</button>`}
function addDet(){if(!selS)return alert("اختار المقاس");if(!selC)return alert("اختار اللون");const k=cur.id+"|"+selS+"|"+selC,x=cart.find(c=>c.k==k);x?x.q++:cart.push({k,id:cur.id,size:selS,color:selC,q:1});upd();closeAll();openCart()}
const P=id=>PRODUCTS.find(p=>p.id==id);
const sum=()=>cart.reduce((s,c)=>s+P(c.id).price*c.q,0);
function upd(){$("cnt").textContent=cart.reduce((s,c)=>s+c.q,0);$("total").textContent=$("total2").textContent=sum()+" "+CUR;
 $("items").innerHTML=cart.length?cart.map((c,i)=>`<div class="row"><div>${P(c.id).name}<br><small>مقاس ${c.size} — ${c.color} — ${P(c.id).price*c.q} ${CUR}</small></div><div class="q"><button onclick="chg(${i},1)">+</button> ${c.q} <button onclick="chg(${i},-1)">−</button></div></div>`).join(""):'<p style="color:var(--mute);padding:14px 0">السلة فاضية</p>'}
function chg(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);upd()}
function openCart(){$("cartOv").classList.add("show")}
function closeAll(){document.querySelectorAll(".ov").forEach(o=>o.classList.remove("show"))}
function toCheckout(){if(!cart.length)return alert("السلة فاضية");closeAll();$("coOv").classList.add("show")}
function send(){
 const n=$("nm").value.trim(),p=$("ph").value.trim(),g=$("gov").value,a=$("ad").value.trim();
 if(!n||!p||!g||!a)return alert("من فضلك املأ الاسم والموبايل والمحافظة والعنوان");
 msg="🖤 *طلب جديد — RAVEN CLOTHING* 🖤\n\n👤 الاسم: "+n+"\n📞 الموبايل: "+p+"\n📍 المحافظة: "+g+"\n🏠 العنوان: "+a+(($("nt").value.trim())?"\n📝 ملاحظات: "+$("nt").value.trim():"")+"\n\n🛒 *الطلبات:*\n"+cart.map(c=>"• "+P(c.id).name+" | مقاس "+c.size+" | لون "+c.color+" | عدد "+c.q+" = "+P(c.id).price*c.q+" "+CUR).join("\n")+"\n\n💰 *الإجمالي: "+sum()+" "+CUR+"* (+ الشحن)";
 closeAll();$("doneOv").classList.add("show");openWA(0);
}
function openWA(i){location.href="https://wa.me/"+NUMBERS[i]+"?text="+encodeURIComponent(msg)}
function finish(){cart=[];upd();closeAll()}
render();upd();
</script></body></html>
